name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v4
      - run: pnpm install --frozen-lockfile
      - run: make codegen
      - run: git diff --exit-code packages/shared/src/generated workers/offline/generated || (echo "generated code out of date or hand-edited (INV-9)"; exit 1)
      - run: make verify
        env: { BASE_REF: "origin/${{ github.base_ref || 'main' }}" }
