[project]
name = "usc-offline-workers"
version = "0.0.1"
description = "USC offline workers (extraction pipelines). Generated Pydantic models live in generated/."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "datamodel-code-generator[http]==0.26.4",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Generated models (INV-9): shapes come from schemas/, not hand-written here.
module = "generated.*"
disallow_any_explicit = false
